<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>配置格式迁移测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      padding: 40px;
      background: #f5f5f5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 32px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 16px;
    }

    .status {
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .status.loading {
      background: #e3f2fd;
      border-left: 4px solid #2196F3;
      color: #1976D2;
    }

    .status.success {
      background: #e8f5e9;
      border-left: 4px solid #4CAF50;
      color: #2E7D32;
    }

    .status.error {
      background: #ffebee;
      border-left: 4px solid #f44336;
      color: #c62828;
    }

    .test-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }

    .work-card {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .work-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .work-card.new-format {
      border-color: #4CAF50;
      border-width: 2px;
    }

    .work-card.old-format {
      border-color: #FF9800;
      border-width: 2px;
    }

    .work-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #f5f5f5;
    }

    .work-info {
      padding: 16px;
    }

    .work-title {
      font-size: 18px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }

    .work-meta {
      font-size: 13px;
      color: #666;
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 8px;
    }

    .badge.new {
      background: #C8E6C9;
      color: #2E7D32;
    }

    .badge.old {
      background: #FFE0B2;
      color: #E65100;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 30px;
    }

    .stat-card {
      padding: 20px;
      background: #fafafa;
      border-radius: 8px;
      text-align: center;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: #333;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 13px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #console-log {
      margin-top: 40px;
      padding: 20px;
      background: #263238;
      color: #4CAF50;
      border-radius: 8px;
      font-family: 'Monaco', 'Consolas', monospace;
      font-size: 12px;
      line-height: 1.6;
      max-height: 400px;
      overflow-y: auto;
    }

    .console-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 配置格式迁移测试</h1>
    <p class="subtitle">测试 imageRef 引用模式 vs 硬编码路径</p>

    <div id="status" class="status loading">
      ⏳ 正在加载配置并转换路径...
    </div>

    <div id="test-grid" class="test-grid">
      <!-- 作品卡片将动态生成 -->
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-value" id="new-count">0</div>
        <div class="stat-label">新格式 (imageRef)</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="old-count">0</div>
        <div class="stat-label">旧格式 (硬编码)</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="load-time">0ms</div>
        <div class="stat-label">加载时间</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="error-count">0</div>
        <div class="stat-label">错误数量</div>
      </div>
    </div>

    <div id="console-log">
      <div class="console-title">📋 控制台日志</div>
      <div id="log-content"></div>
    </div>
  </div>

  <script type="module">
    import { enrichWorks } from './src/utils/workAdapter.js';
    import { materialTextureWorks } from './src/data/materialTextureWorks.js';

    const logElement = document.getElementById('log-content');
    const statusElement = document.getElementById('status');

    // 重写 console.log 以在页面显示
    const originalLog = console.log;
    const originalError = console.error;

    function addLog(message, type = 'log') {
      const color = type === 'error' ? '#f44336' : '#4CAF50';
      logElement.innerHTML += `<div style="color: ${color}">${message}</div>`;
      logElement.scrollTop = logElement.scrollHeight;
      
      if (type === 'log') originalLog(message);
      else originalError(message);
    }

    console.log = (...args) => addLog(args.join(' '), 'log');
    console.error = (...args) => addLog(args.join(' '), 'error');

    async function runTest() {
      try {
        addLog('========================================');
        addLog('🧪 开始测试配置格式迁移');
        addLog('========================================');

        const startTime = performance.now();

        // 选择前4个作品进行测试（ID 1-2是新格式，3-4是旧格式）
        const testWorks = materialTextureWorks.slice(0, 4);
        addLog(`📦 加载了 ${testWorks.length} 个测试作品配置`);

        // 使用 workAdapter 转换
        addLog('🔄 开始使用 workAdapter 转换...');
        const enrichedWorks = await enrichWorks(testWorks);

        const endTime = performance.now();
        const loadTime = (endTime - startTime).toFixed(2);

        // 统计
        const newFormatCount = enrichedWorks.filter(w => w.imageRef).length;
        const oldFormatCount = enrichedWorks.filter(w => !w.imageRef).length;
        const errorCount = enrichedWorks.filter(w => w.error).length;

        document.getElementById('new-count').textContent = newFormatCount;
        document.getElementById('old-count').textContent = oldFormatCount;
        document.getElementById('load-time').textContent = `${loadTime}ms`;
        document.getElementById('error-count').textContent = errorCount;

        // 渲染作品卡片
        const grid = document.getElementById('test-grid');
        enrichedWorks.forEach(work => {
          const card = document.createElement('div');
          card.className = `work-card ${work.imageRef ? 'new-format' : 'old-format'}`;
          
          card.innerHTML = `
            <img 
              class="work-image" 
              src="${work.image}" 
              alt="${work.title}"
              onerror="this.src='/placeholder.png'; this.style.border='2px solid #f44336';"
            />
            <div class="work-info">
              <div class="work-title">${work.title}</div>
              <div class="work-meta">
                ID: ${work.id}<br>
                类别: ${work.category}<br>
                媒介: ${work.media}<br>
                ${work.aspectType ? `方向: ${work.aspectType}<br>` : ''}
                ${work.dimensions ? `尺寸: ${work.dimensions.width}x${work.dimensions.height}` : ''}
              </div>
              <div class="badge ${work.imageRef ? 'new' : 'old'}">
                ${work.imageRef ? '新格式 ImageRef' : '旧格式 硬编码'}
              </div>
            </div>
          `;
          
          grid.appendChild(card);
        });

        // 更新状态
        if (errorCount > 0) {
          statusElement.className = 'status error';
          statusElement.textContent = `❌ 测试完成，发现 ${errorCount} 个错误`;
        } else {
          statusElement.className = 'status success';
          statusElement.textContent = `✅ 测试成功！新格式和旧格式都工作正常`;
        }

        addLog('');
        addLog('========================================');
        addLog('✅ 测试完成！');
        addLog(`⏱️  总耗时: ${loadTime}ms`);
        addLog(`📊 新格式: ${newFormatCount} | 旧格式: ${oldFormatCount} | 错误: ${errorCount}`);
        addLog('========================================');

      } catch (error) {
        statusElement.className = 'status error';
        statusElement.textContent = `❌ 测试失败: ${error.message}`;
        addLog(`❌ 错误: ${error.message}`, 'error');
        console.error('测试失败:', error);
      }
    }

    // 启动测试
    runTest();
  </script>
</body>
</html>
